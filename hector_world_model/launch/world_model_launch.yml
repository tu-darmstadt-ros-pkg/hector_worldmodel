launch:
- arg:
    name: name
    default: world_model
    description: node name
- arg:
    name: params_file
    default: "$(find-pkg-share hector_world_model)/config/params.yml"
    description: "Path to the parameter file"

- node:
    pkg: hector_world_model
    exec: world_model
    name: "$(var name)"
    output: screen
    param:
     - from: "$(var params_file)"

